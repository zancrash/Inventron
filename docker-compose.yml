services:
  db:
    image: postgres:18
    environment:
       POSTGRES_DB: inventron
       POSTGRES_USER: inventron
       POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pg-data:/var/lib/postgresql
    ports:
      # 5433 on the host because a Windows PostgreSQL service already uses 5432.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventron -d inventron"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    environment:
      # Development supplies the temporary tenant until auth exists.
      ASPNETCORE_ENVIRONMENT: Development
      Database__MigrateOnStartup: "true"
      ConnectionStrings__LocalConnection: Host=db;Port=5432;Database=inventron;Username=inventron;Password=${POSTGRES_PASSWORD}
    ports:
      - "5206:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pg-data:
